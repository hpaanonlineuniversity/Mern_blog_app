services:
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
        - node_modules_backend:/app/node_modules
        - ./backend:/app


  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
        - node_modules_frontend:/app/node_modules
        - ./frontend:/app

volumes:
  node_modules_backend:
  node_modules_frontend: